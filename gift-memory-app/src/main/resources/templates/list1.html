 
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Occasions - Gift Memory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">🎁 Gift Memory</a>
        <a th:href="@{/dashboard}" class="btn btn-light">Dashboard</a>
    </div>
</nav>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📅 Manage Occasions</h2>
        <a th:href="@{/occasions/add}" class="btn btn-primary">+ Add Occasion</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <div th:if="${#lists.isEmpty(occasions)}" class="alert alert-info">
                No occasions added yet.
            </div>

            <div class="table-responsive"
                 th:if="${not #lists.isEmpty(occasions)}">

                <table class="table table-bordered table-hover">
                    <thead class="table-primary">
                    <tr>
                        <th>Occasion</th>
                        <th>Person</th>
                        <th>Date</th>
                        <th>Type</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="occasion : ${occasions}">
                        <td th:text="${occasion.occasionName}"></td>
                        <td th:text="${occasion.person.personName}"></td>
                        <td th:text="${occasion.occasionDate}"></td>
                        <td th:text="${occasion.occasionType}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>
</body>
</html>
