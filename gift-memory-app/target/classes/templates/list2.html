 
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Gifts - Gift Memory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">🎁 Gift Memory</a>
        <a th:href="@{/dashboard}" class="btn btn-light">Dashboard</a>
    </div>
</nav>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>🎁 Manage Gifts</h2>
        <a th:href="@{/gifts/add}" class="btn btn-primary">+ Add Gift</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <div th:if="${#lists.isEmpty(gifts)}" class="alert alert-info">
                No gift ideas added yet.
            </div>

            <div class="table-responsive"
                 th:if="${not #lists.isEmpty(gifts)}">

                <table class="table table-bordered table-hover">
                    <thead class="table-primary">
                    <tr>
                        <th>Gift Name</th>
                        <th>Person</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Description</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="gift : ${gifts}">
                        <td th:text="${gift.giftName}"></td>
                        <td th:text="${gift.person.personName}"></td>
                        <td th:text="${gift.category}"></td>
                        <td th:text="${gift.price}"></td>
                        <td th:text="${gift.description}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>
</body>
</html>
