<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gift Memory - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card mx-auto shadow p-4"
         style="max-width:450px">

        <h2 class="text-center">Create Account</h2>

        <div th:if="${error}"
             class="alert alert-danger"
             th:text="${error}">
        </div>

        <form th:action="@{/register}"
              th:object="${user}"
              method="post">

            <div class="mb-3">
                <label>Full Name</label>
                <input type="text"
                       th:field="*{name}"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email"
                       th:field="*{email}"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password"
                       th:field="*{password}"
                       class="form-control"
                       minlength="8"
                       required>
            </div>

            <button class="btn btn-success w-100">
                Register
            </button>

        </form>

        <p class="text-center mt-3">
            Already registered?
            <a th:href="@{/login}">Login</a>
        </p>

    </div>
</div>

</body>
</html>
