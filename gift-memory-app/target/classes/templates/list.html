 
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage People - Gift Memory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">🎁 Gift Memory</a>
        <a th:href="@{/dashboard}" class="btn btn-light">Dashboard</a>
    </div>
</nav>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>👥 Manage People</h2>
        <a th:href="@{/persons/add}" class="btn btn-primary">+ Add Person</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <div th:if="${#lists.isEmpty(persons)}" class="alert alert-info">
                No people added yet. Click "Add Person" to get started.
            </div>

            <div class="table-responsive" th:if="${not #lists.isEmpty(persons)}">
                <table class="table table-bordered table-hover">
                    <thead class="table-primary">
                    <tr>
                        <th>Name</th>
                        <th>Relationship</th>
                        <th>Birthday</th>
                        <th>Contact</th>
                        <th>Interests</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="person : ${persons}">
                        <td th:text="${person.personName}"></td>
                        <td th:text="${person.relationship}"></td>
                        <td th:text="${person.birthday}"></td>
                        <td th:text="${person.contact}"></td>
                        <td th:text="${person.interests}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>
</body>
</html>
